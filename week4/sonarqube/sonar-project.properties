# SonarQube Configuration
# Exercise: Configure SonarQube for code quality analysis

# Project identification
sonar.projectKey=cognizant-deep-skilling-week4
sonar.projectName=Deep Skilling Week 4
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Exclusions
sonar.exclusions=**/target/**,**/generated-sources/**

# Java version
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Test coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Quality gate
sonar.qualitygate.wait=true

# SonarQube server (replace with your server URL)
sonar.host.url=http://localhost:9000

# Authentication token (replace with your token)
sonar.login=your-token-here

# Analysis parameters
sonar.scm.enabled=false
